worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compress text responses (SSE is text/event-stream, not listed here,
    # so streams are never gzip-buffered).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Edge cache for Next.js immutable build assets.
    proxy_cache_path /var/cache/nginx/static
        levels=1:2
        keys_zone=static_cache:10m
        max_size=512m
        inactive=7d
        use_temp_path=off;

    upstream nextjs_app {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clear the Connection header so upstream keepalive works.
        proxy_set_header Connection "";

        # Server-Sent Events: the response stays open for hours, so buffering,
        # caching, and short read timeouts would all break it.
        location = /api/events {
            proxy_pass http://nextjs_app;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Hashed build assets are immutable — cache them at the proxy and in
        # the browser for a year.
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            proxy_ignore_headers Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass http://nextjs_app;
        }
    }
}
